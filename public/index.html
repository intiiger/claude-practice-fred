<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRED 거시경제 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#f8faff; --card:#fff; --border:#e2e8f0; --text:#1e293b; --muted:#64748b; --err:#dc2626; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:system-ui,'Segoe UI',sans-serif; padding:32px; }
    header { margin-bottom:24px; }
    h1 { font-size:24px; font-weight:700; }
    .subtitle { color:var(--muted); font-size:14px; margin-top:4px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:20px; }
    /* min-width:0 lets the grid track shrink instead of the Chart.js canvas
       forcing the card past its column into the next one. */
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; min-width:0; }
    .card h2 { font-size:16px; font-weight:600; margin-bottom:4px; }
    .card .ind { color:var(--muted); font-size:12px; margin-bottom:12px; }
    .chart-wrap { position:relative; height:260px; min-width:0; }
    .chart-wrap canvas { position:absolute; inset:0; }
    .status { font-size:13px; color:var(--muted); padding:8px 0; }
    .status.error { color:var(--err); }
  </style>
</head>
<body>
  <header>
    <h1>FRED 거시경제 대시보드</h1>
    <p class="subtitle">5개 카테고리 · 카테고리별 대표 지표 (출처: FRED, St. Louis Fed)</p>
  </header>
  <main id="dashboard" class="grid" aria-busy="true"></main>
  <script src="/app.js"></script>
</body>
</html>
